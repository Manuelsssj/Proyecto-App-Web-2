name: Go CI

on:
  push:
    branches:
      - main
      - feature/suscripciones
  pull_request:
    branches:
      - main

jobs:
  build-vet-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Descargar dependencias
        run: go mod download

      - name: Verificar codigo con go vet
        run: go vet ./...

      - name: Ejecutar tests
        run: go test ./... -cover