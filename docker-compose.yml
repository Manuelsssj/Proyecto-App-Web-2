services:
  db:
    image: postgres:16
    container_name: rideuleam_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rideuleam
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rideuleam"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: rideuleam_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: host=db user=postgres password=postgres dbname=rideuleam port=5432 sslmode=disable
      PORT: "8080"
      JWT_SECRETO: rideuleam-secreto-dev
    ports:
      - "8080:8080"

volumes:
  postgres_data: